# Render Blueprint for Lớp học vui vẻ 12A. Connect THIS existing GitHub repo.
services:
  - type: web
    name: classroom-12a-live-bridge
    runtime: node
    plan: free
    region: singapore
    rootDir: bridge
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TIKTOK_USERNAME
        sync: false
      - key: NODE_VERSION
        value: 22
